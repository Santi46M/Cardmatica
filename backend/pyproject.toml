[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cardmatica-backend"
version = "0.1.0"
description = "Catálogo de Cardmática y mantenimiento de datos con procedencia"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
    "sqlalchemy>=2.0.36,<2.1", "alembic>=1.14,<2",
    "psycopg[binary]>=3.2.4,<4", "pydantic-settings>=2.7,<3",
    "httpx>=0.28,<1", "beautifulsoup4>=4.12,<5",
    "mwparserfromhell>=0.6.6,<1", "pillow>=11,<14"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "playwright>=1.50,<2"]

[project.scripts]
cardmatica = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/banlists/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

