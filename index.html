<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Cardmática</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="gl">
    <div class="bar">
        <a href="/" class="logo" aria-label="Ir al inicio">
            Card<b>mática</b>
        </a><div class="seg" role="group" aria-label="Mercado"><button data-mk="TCG" aria-pressed="true" title="Cartas occidentales">TCG</button><button data-mk="OCG" aria-pressed="false" title="Cartas asiáticas">OCG</button></div>
        <label class="search"><input id="q" type="search" placeholder="Nombre, código, set o arquetipo" aria-label="Buscar cartas"></label>
        <select id="cur" aria-label="Moneda"></select><button class="btn" id="cb">Carrito (<span id="cc">0</span>)</button>
    </div>
    <nav id="tabs"></nav>
</header>
<main>
    <div id="home"></div><div id="prod" style="display:none"><div class="tools"><select id="pc" aria-label="Categoría"></select><span class="cnt" id="pcnt"></span></div><div class="pn gl wrap"><table><thead><tr><th>Producto</th><th>Categoría</th><th class="hide">Lanzamiento</th><th class="num">Desde</th><th class="num hide">Ofertas</th></tr></thead><tbody id="pl"></tbody></table></div></div><div id="cat" style="display:none">
    <div class="tools">
        <select id="sub" aria-label="Subtipo"></select><select id="rar" aria-label="Rareza"></select><select id="stp" aria-label="Origen del set"></select>
        <select id="srt" aria-label="Ordenar"></select>
        <span class="cnt" id="cnt"></span>
    </div>
    <div class="pn gl wrap"><table><thead><tr><th>Carta</th><th class="num hide">Impresiones</th><th class="num">Última venta</th></tr></thead><tbody id="list"></tbody></table></div>
</div>
    <div id="wlv" style="display:none"></div><div id="pfv" style="display:none"></div><div id="cartv" style="display:none"></div>
    <div id="vend" style="display:none"><div class="pn gl wrap"><table><thead><tr><th>Vendedor</th><th class="hide">País</th><th>Valoración</th><th class="num">Artículos</th><th class="num hide">Unidades</th><th class="num">Valor</th></tr></thead><tbody id="vl"></tbody></table></div></div>
    <p id="catalog-status" class="catalog-status" role="status" aria-live="polite"></p>
    <p id="commercial-notice" class="catalog-status" hidden>Productos, vendedores, precios, tipos de cambio y carrito pertenecen al comercio de demostración original. No representan ofertas del catálogo importado.</p>
</main>
<div id="md" role="dialog" aria-modal="true"><div class="box" id="mb"></div></div>
<div id="cart" role="dialog" aria-modal="true"><div class="box" id="cbx"></div></div>
<div class="toast" id="ts"></div>
<script src="frontend/demo/data.js"></script>
<script src="frontend/demo/store.js"></script>
<script type="module" src="frontend/js/catalog.js"></script>
</body>
</html>
